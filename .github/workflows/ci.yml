name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xenon
          POSTGRES_PASSWORD: xenon
          POSTGRES_DB: xenon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xenon -d xenon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runs the database adapter conformance suite against a real PostgreSQL server too.
      XENON_TEST_DATABASE_URL: postgres://xenon:xenon@localhost:5432/xenon_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # `changeset status --since` compares against the base branch
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Build first: the apps typecheck against xenon-cms's emitted types, and some tests resolve
      # the package's own `xenon-cms/client` self-reference from dist.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:scripts
      - name: Changeset status
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bunx changeset status --since="origin/$BASE_REF" || echo "::notice::No changeset in this PR. Add one with 'bun run changeset' if it changes a published package."

  bench:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run bench -- --json bench-results.json --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results.json
